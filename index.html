<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Yechen Wang — portfolio." />
  <title>Yechen Wang — Portfolio</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #f1ede6;
    }
  </style>
</head>
<body>
  <script>
    (async () => {
      const APP_VERSION = '20261104-unified-cards-inline-grid-v3';
      try {
        const url = new URL('app.html', window.location.href);
        url.searchParams.set('v', APP_VERSION);
        url.searchParams.set('fresh', Date.now().toString());

        const response = await fetch(url.toString(), {
          cache: 'no-store',
          headers: { 'Cache-Control': 'no-cache' }
        });

        if (!response.ok) throw new Error('Failed to load portfolio');

        const html = await response.text();
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.body.innerHTML =
          '<div style="font-family:system-ui,sans-serif;color:#232933;padding:40px">Unable to load portfolio. Please reload the page.</div>';
      }
    })();
  </script>
</body>
</html>
