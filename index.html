<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="description" content="Yechen Wang — portfolio." />
  <title>Yechen Wang — Portfolio</title>
  <style>
:root {
  --bg: #090a0c;
  --panel: #111318;
  --panel-soft: #14171c;
  --line: rgba(255,255,255,.08);
  --line-strong: rgba(255,255,255,.14);
  --text: #d9dce2;
  --muted: #7d838d;
  --faint: #454a53;
  --blue: #60789a;
  --violet: #716b88;
  --green: #62766d;
  --copper: #806555;
  --steel: #66717b;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body {
  min-height: 100vh;
  overflow-x: hidden;
}

button, a { font: inherit; }
a { color: inherit; text-decoration: none; }

.ambient {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

.ambient::before {
  content: "";
  position: absolute;
  width: min(760px, 80vw);
  aspect-ratio: 1;
  left: 50%;
  top: 48%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: radial-gradient(circle, rgba(91,105,133,.065), transparent 67%);
}

.ambient::after {
  content: "";
  position: absolute;
  inset: 0;
  opacity: .024;
  background-image:
    linear-gradient(rgba(255,255,255,.18) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.18) 1px, transparent 1px);
  background-size: 72px 72px;
}

.site-header {
  position: fixed;
  z-index: 100;
  top: 0;
  left: 0;
  right: 0;
  height: 72px;
  padding: 0 5vw;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(9,10,12,.82);
  border-bottom: 1px solid rgba(255,255,255,.05);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

.brand {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: .01em;
}

.main-nav {
  display: flex;
  align-items: center;
  gap: 32px;
}

.main-nav > a,
.project-toggle {
  border: 0;
  background: transparent;
  padding: 0;
  color: var(--muted);
  font-size: 13px;
  cursor: pointer;
  transition: color .2s ease;
}

.main-nav > a:hover,
.project-toggle:hover,
.main-nav > .active {
  color: var(--text);
}

.future-link { opacity: .82; }

.project-nav { position: relative; }

.project-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.chevron {
  font-size: 10px;
  transition: transform .2s ease;
}

.project-nav.open .chevron { transform: rotate(180deg); }

.project-menu {
  position: absolute;
  top: 31px;
  right: -10px;
  width: 238px;
  padding: 7px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(16,18,22,.98);
  box-shadow: 0 22px 60px rgba(0,0,0,.38);
  opacity: 0;
  visibility: hidden;
  transform: translateY(-7px);
  transition: .18s ease;
}

.project-nav.open .project-menu {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

.project-menu button {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  border: 0;
  border-radius: 8px;
  padding: 11px 12px;
  background: transparent;
  color: var(--muted);
  text-align: left;
  font-size: 12px;
  cursor: pointer;
}

.project-menu button:hover {
  color: var(--text);
  background: rgba(255,255,255,.04);
}

.project-menu button span {
  width: 14px;
  color: var(--faint);
}

main {
  min-height: 100vh;
  padding-top: 72px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.intro {
  position: relative;
  z-index: 5;
  width: min(1120px, 90vw);
  margin: 0 auto 4px;
}

.intro p {
  margin: 0 0 9px;
  color: var(--faint);
  font-size: 10px;
  font-weight: 650;
  letter-spacing: .16em;
}

.intro h1 {
  margin: 0;
  color: #d5d8de;
  font-size: clamp(30px, 3.4vw, 46px);
  line-height: 1;
  font-weight: 520;
  letter-spacing: -.04em;
}

.carousel {
  position: relative;
  width: 100%;
  height: min(570px, 64vh);
  display: flex;
  align-items: center;
  justify-content: center;
  perspective: 1500px;
  overflow: hidden;
  touch-action: pan-y;
  user-select: none;
  outline: none;
}

.stage {
  position: relative;
  width: min(1240px, 100vw);
  height: 460px;
  transform-style: preserve-3d;
}

.project-card {
  --accent: var(--blue);
  position: absolute;
  top: 50%;
  left: 50%;
  width: min(430px, 76vw);
  height: 380px;
  padding: 28px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background:
    linear-gradient(145deg, rgba(255,255,255,.026), rgba(255,255,255,.004)),
    var(--panel);
  box-shadow: 0 34px 80px rgba(0,0,0,.42);
  overflow: hidden;
  cursor: pointer;
  transform-style: preserve-3d;
  transition:
    transform .62s cubic-bezier(.2,.75,.2,1),
    opacity .48s ease,
    filter .48s ease,
    border-color .3s ease;
}

.project-card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 54%);
  pointer-events: none;
}

.project-card::after {
  content: "";
  position: absolute;
  left: 14%;
  right: 14%;
  top: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent) 45%, transparent), transparent);
  opacity: .45;
}

.project-card.active { border-color: var(--line-strong); }

.project-card:nth-child(1) { --accent: var(--blue); }
.project-card:nth-child(2) { --accent: var(--violet); }
.project-card:nth-child(3) { --accent: var(--green); }
.project-card:nth-child(4) { --accent: var(--copper); }
.project-card:nth-child(5) { --accent: var(--steel); }

.card-top {
  position: relative;
  z-index: 2;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.number {
  color: #8a909a;
  font-size: 13px;
  font-weight: 560;
}

.type {
  color: var(--faint);
  font-size: 9px;
  font-weight: 650;
  letter-spacing: .12em;
  text-transform: uppercase;
}

.visual {
  position: relative;
  z-index: 2;
  height: 246px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.ring {
  width: 148px;
  height: 148px;
  border: 1px solid color-mix(in srgb, var(--accent) 31%, transparent);
  border-radius: 50%;
  transform: rotateX(63deg) rotateZ(-18deg);
  box-shadow: inset 0 0 32px color-mix(in srgb, var(--accent) 4%, transparent);
}

.ring::before,
.ring::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  border: 1px solid color-mix(in srgb, var(--accent) 17%, transparent);
}

.ring::before { inset: 24px; }
.ring::after {
  inset: 52px;
  background: color-mix(in srgb, var(--accent) 18%, transparent);
}

.dot {
  position: absolute;
  width: 6px;
  height: 6px;
  left: calc(50% - 3px);
  top: 47px;
  border-radius: 50%;
  background: color-mix(in srgb, var(--accent) 78%, #d8dce2);
  box-shadow: 0 0 16px color-mix(in srgb, var(--accent) 42%, transparent);
}

.project-card h2 {
  position: relative;
  z-index: 2;
  margin: 0;
  max-width: 330px;
  color: #d5d8de;
  font-size: clamp(22px, 2.2vw, 29px);
  line-height: 1.12;
  font-weight: 520;
  letter-spacing: -.03em;
}

.carousel-controls {
  position: relative;
  z-index: 20;
  width: min(1120px, 90vw);
  margin: -14px auto 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 22px;
}

.arrow {
  width: 38px;
  height: 38px;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: #0f1115;
  color: #878d97;
  cursor: pointer;
  transition: .18s ease;
}

.arrow:hover {
  color: var(--text);
  background: #15181d;
  transform: scale(1.04);
}

.selectors {
  display: flex;
  gap: 11px;
  align-items: center;
}

.selector {
  width: 26px;
  height: 26px;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--faint);
  font-size: 11px;
  cursor: pointer;
  transition: .2s ease;
}

.selector.active {
  color: #d0d4da;
  transform: scale(1.12);
}

footer {
  position: fixed;
  left: 5vw;
  right: 5vw;
  bottom: 23px;
  display: flex;
  justify-content: space-between;
  color: #3d424a;
  font-size: 10px;
  letter-spacing: .035em;
}

@media (max-width: 760px) {
  .site-header { padding: 0 22px; }
  .main-nav { gap: 18px; }
  .project-menu { right: -55px; }
  main { padding-top: 92px; justify-content: flex-start; }
  .intro { width: calc(100% - 44px); margin-top: 30px; }
  .intro h1 { font-size: 32px; }
  .carousel { height: 520px; }
  .stage { height: 420px; }
  .project-card {
    width: 78vw;
    height: 350px;
    padding: 24px;
  }
  .visual { height: 220px; }
  .ring { width: 122px; height: 122px; }
  .ring::before { inset: 20px; }
  .ring::after { inset: 42px; }
  .dot { top: 44px; }
  footer { display: none; }
}

@media (max-width: 520px) {
  .brand { font-size: 13px; }
  .main-nav > a,
  .project-toggle { font-size: 12px; }
  .main-nav { gap: 14px; }
  .project-card { width: 82vw; }
}

  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>

  <header class="site-header">
    <a class="brand" href="index.html">Yechen Wang</a>

    <nav class="main-nav" aria-label="Primary navigation">
      <a class="active" href="index.html">Home</a>

      <div class="project-nav" id="projectNav">
        <button class="project-toggle" id="projectToggle" type="button" aria-expanded="false">
          Projects <span class="chevron">⌄</span>
        </button>
        <div class="project-menu" id="projectMenu">
          <button type="button" data-project="0"><span>1</span>MPhil Research</button>
          <button type="button" data-project="1"><span>2</span>ICASSP Research Project</button>
          <button type="button" data-project="2"><span>3</span>Bachelor Thesis</button>
          <button type="button" data-project="3"><span>4</span>Engineering Design</button>
          <button type="button" data-project="4"><span>5</span>Engineering Internship</button>
        </div>
      </div>

      <a class="future-link" href="#" aria-label="About page coming next">About</a>
    </nav>
  </header>

  <main>
    <section class="intro">
      <p>PORTFOLIO</p>
      <h1>Selected work.</h1>
    </section>

    <section class="carousel" id="carousel" tabindex="0" aria-label="Selected projects">
      <div class="stage">
        <article class="project-card" data-index="0">
          <div class="card-top"><span class="number">1</span><span class="type">Research</span></div>
          <div class="visual"><span class="ring"></span><span class="dot"></span></div>
          <h2>MPhil Research</h2>
        </article>

        <article class="project-card" data-index="1">
          <div class="card-top"><span class="number">2</span><span class="type">Research Project</span></div>
          <div class="visual"><span class="ring"></span><span class="dot"></span></div>
          <h2>ICASSP Research Project</h2>
        </article>

        <article class="project-card" data-index="2">
          <div class="card-top"><span class="number">3</span><span class="type">Undergraduate Research</span></div>
          <div class="visual"><span class="ring"></span><span class="dot"></span></div>
          <h2>Bachelor Thesis</h2>
        </article>

        <article class="project-card" data-index="3">
          <div class="card-top"><span class="number">4</span><span class="type">Engineering</span></div>
          <div class="visual"><span class="ring"></span><span class="dot"></span></div>
          <h2>Engineering Design</h2>
        </article>

        <article class="project-card" data-index="4">
          <div class="card-top"><span class="number">5</span><span class="type">Industry</span></div>
          <div class="visual"><span class="ring"></span><span class="dot"></span></div>
          <h2>Engineering Internship</h2>
        </article>
      </div>
    </section>

    <div class="carousel-controls" aria-label="Project selector">
      <button class="arrow" id="previous" type="button" aria-label="Previous project">←</button>
      <div class="selectors">
        <button class="selector active" type="button" data-select="0">1</button>
        <button class="selector" type="button" data-select="1">2</button>
        <button class="selector" type="button" data-select="2">3</button>
        <button class="selector" type="button" data-select="3">4</button>
        <button class="selector" type="button" data-select="4">5</button>
      </div>
      <button class="arrow" id="next" type="button" aria-label="Next project">→</button>
    </div>
  </main>

  <footer>
    <span>Yechen Wang</span>
    <span>Drag · scroll · arrow keys</span>
  </footer>
  <script>
const cards = [...document.querySelectorAll('.project-card')];
const selectors = [...document.querySelectorAll('.selector')];
const carousel = document.getElementById('carousel');
const previous = document.getElementById('previous');
const next = document.getElementById('next');
const projectNav = document.getElementById('projectNav');
const projectToggle = document.getElementById('projectToggle');

let active = 0;
let pointerStart = null;
let wheelLocked = false;

function circularDistance(index, current, total) {
  let distance = index - current;
  if (distance > total / 2) distance -= total;
  if (distance < -total / 2) distance += total;
  return distance;
}

function updateCarousel() {
  const total = cards.length;
  const spacing = Math.min(window.innerWidth * 0.29, 350);

  cards.forEach((card, index) => {
    const distance = circularDistance(index, active, total);
    const depth = Math.abs(distance);

    let x = distance * spacing;
    if (depth > 1) x *= 1.05;

    const z = -depth * 220;
    const rotateY = distance * -19;
    const scale = 1 - depth * 0.105;

    card.style.transform =
      `translate(-50%, -50%) translate3d(${x}px, 0, ${z}px) rotateY(${rotateY}deg) scale(${scale})`;
    card.style.zIndex = String(20 - depth);
    card.style.opacity = depth === 0 ? '1' : depth === 1 ? '.43' : '.12';
    card.style.filter = depth === 0 ? 'none' : `brightness(${Math.max(.48, 1 - depth * .23)})`;
    card.classList.toggle('active', index === active);
  });

  selectors.forEach((selector, index) => {
    selector.classList.toggle('active', index === active);
  });
}

function setProject(index) {
  active = (index + cards.length) % cards.length;
  updateCarousel();
}

function goNext() { setProject(active + 1); }
function goPrevious() { setProject(active - 1); }

next.addEventListener('click', goNext);
previous.addEventListener('click', goPrevious);

selectors.forEach((selector) => {
  selector.addEventListener('click', () => setProject(Number(selector.dataset.select)));
});

cards.forEach((card, index) => {
  card.addEventListener('click', () => {
    if (index !== active) setProject(index);
  });
});

carousel.addEventListener('keydown', (event) => {
  if (event.key === 'ArrowRight') goNext();
  if (event.key === 'ArrowLeft') goPrevious();
});

carousel.addEventListener('wheel', (event) => {
  if (wheelLocked || Math.abs(event.deltaY) < 8) return;
  wheelLocked = true;
  event.deltaY > 0 ? goNext() : goPrevious();
  window.setTimeout(() => { wheelLocked = false; }, 460);
}, { passive: true });

carousel.addEventListener('pointerdown', (event) => {
  pointerStart = event.clientX;
  carousel.setPointerCapture?.(event.pointerId);
});

carousel.addEventListener('pointerup', (event) => {
  if (pointerStart === null) return;
  const movement = event.clientX - pointerStart;
  if (movement > 55) goPrevious();
  if (movement < -55) goNext();
  pointerStart = null;
});

projectToggle.addEventListener('click', (event) => {
  event.stopPropagation();
  const open = projectNav.classList.toggle('open');
  projectToggle.setAttribute('aria-expanded', String(open));
});

document.querySelectorAll('[data-project]').forEach((button) => {
  button.addEventListener('click', () => {
    setProject(Number(button.dataset.project));
    projectNav.classList.remove('open');
    projectToggle.setAttribute('aria-expanded', 'false');
  });
});

document.querySelectorAll('.future-link').forEach((link) => {
  link.addEventListener('click', (event) => event.preventDefault());
});

document.addEventListener('click', (event) => {
  if (!projectNav.contains(event.target)) {
    projectNav.classList.remove('open');
    projectToggle.setAttribute('aria-expanded', 'false');
  }
});

window.addEventListener('resize', updateCarousel);

updateCarousel();

  </script>
</body>
</html>
